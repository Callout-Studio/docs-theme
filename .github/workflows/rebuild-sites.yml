name: Rebuild the sites

# Rebuilds both docs sites with the theme as it is now. Each site builds with
# the commit of this repository written in its theme-commit.txt, so all this
# does is write this commit there. It pushes with a deploy key of each site
# repository, kept here as the DOCS_SITE_DEPLOY_KEY and
# INTERNAL_DOCS_SITE_DEPLOY_KEY secrets; a deploy key never expires.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "dev.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-sites
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'Callout-Studio/docs-theme'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: Callout-Studio/docs
            key: DOCS_SITE_DEPLOY_KEY
          - site: Callout-Studio/internal-docs
            key: INTERNAL_DOCS_SITE_DEPLOY_KEY
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.site }}
          ssh-key: ${{ secrets[matrix.key] }}

      - name: Point the site at this commit
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "$GITHUB_SHA" > theme-commit.txt
          git add theme-commit.txt
          if git diff --cached --quiet; then
              echo "The site already builds with $GITHUB_SHA."
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject="Theme from Callout-Studio/docs-theme@${GITHUB_SHA::7}"
          if [ -n "$MESSAGE" ]; then
              git commit --quiet -m "$subject" -m "${MESSAGE%%$'\n'*}"
          else
              git commit --quiet -m "$subject"
          fi
          for attempt in 1 2 3; do
              git push --quiet && exit 0
              git pull --quiet --rebase
          done
          exit 1
